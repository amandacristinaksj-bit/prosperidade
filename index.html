:root{--bg:#06140e;--panel:#0b2118;--panel2:#102d21;--line:#2b4938;--gold:#d4aa63;--text:#f5f1e6;--muted:#b3bdaf;--green:#5fa78b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:0 0 10px}h1{font-size:38px}h2{font-size:28px}h3{font-size:21px}p{margin:8px 0 16px}.muted{color:var(--muted)}.gold{color:var(--gold)}header{padding:25px 18px 22px;background:linear-gradient(135deg,#092b1c,#06140e 70%);border-bottom:1px solid var(--line)}header small{letter-spacing:3px;color:var(--gold);font-size:10px}.wrap{max-width:900px;margin:auto;padding:22px 14px 110px}.card{background:linear-gradient(140deg,var(--panel),#071910);border:1px solid var(--line);border-radius:19px;padding:18px;margin:12px 0}.soft{background:var(--panel2)}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.btn,button{font:inherit;cursor:pointer}button{border:1px solid #72572b;background:#65420d;color:#fff0d0;padding:10px 14px;border-radius:12px;font-weight:650}button.secondary{background:transparent;border-color:var(--line);color:var(--gold)}button.active,.chip.active{background:var(--gold);color:#142019;border-color:var(--gold)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}.chip{border:1px solid var(--line);background:#10291d;border-radius:24px;color:var(--text);padding:8px 12px}.small{font-size:12px}.tile{padding:15px;border:1px solid var(--line);border-radius:15px;background:#0c261a;cursor:pointer;min-height:95px}.tile strong{display:block;color:var(--gold);margin:4px 0}.tile span{font-size:12px;color:var(--muted)}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#071910;border-top:1px solid var(--line);display:flex;overflow-x:auto;justify-content:center;padding-botto const KEY='alem_v4_interativo';const defaults={mood:3,energy:2,confidence:45,day:{},journal:[],board:[],goals:[{name:'Conseguir um emprego',steps:[]},{name:'Concluir a faculdade',steps:[]},{name:'Construir independência',steps:[]},{name:'Cuidar de mim',steps:[]},{name:'Construir um relacionamento saudável',steps:[]}],practice:{},draft:{},selectedDate:'',affirm:0};let S;try{S={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){S=structuredClone(defaults)};let page='inicio',selectedTechnique=null,month=new Date().getMonth(),year=new Date().getFullYear();const today=()=>new Date().toLocaleDateString('en-CA');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Armazenamento cheio. Remova algumas imagens ou exporte seus dados.')}};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nav=p=>{page=p;selectedTechnique=null;render();window.scrollTo(0,0)};const b=(label,fn,cls='secondary')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;const pct=n=>`<div class="progress"><i style="width:${Math.max(0,Math.min(100,n))}%"></i></div>`;

{id:'autosabotagem',name:'Autossabotagem e obstáculos',source:'Hélio Couto — Coletânea de Prosperidade, cap. IV',category:'Prosperidade',intro:'Identifique o bloqueio e selecione uma resposta possível.',steps:['Qual obstáculo aparece?','O que costuma acontecer?','Escolha uma estratégia','Escolha um próximo passo'],opts:[['Procrastinação','Medo de rejeição','Comparação','Desânimo'],['Adio','Desisto','Me cobro','Me isolo'],['Dividir em 2 minutos','Pedir apoio','Diminuir a meta','Fazer uma pausa'],['Hoje','Amanhã','Esta semana']]},

function record(kind,label,details){S.journal.unshift({date:today(),kind,label,details,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});save()}
function render(){const names=[['inicio','✦','Início'],['tecnicas','◇','Técnicas'],['diario','▦','Diário'],['sonhos','☆','Sonhos'],['livros','▤','Livros'],['rituais','♡','Rituais']];$('tabs').innerHTML=names.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="nav('${p}')">${i}<br>${n}</button>`).join('');$('app').innerHTML=({inicio:home,tecnicas:techPage,diario:diary,sonhos:dreams,livros:books,rituais:ritual})[page]();}
function home(){const done=S.day[today()]||{};const count=Object.values(done).filter(Boolean).length;return `<h2>Meu novo capítulo</h2><p class="muted">Um lugar para escolher, praticar e acompanhar o que importa para você.</p><div class="grid"><div class="tile" onclick="nav('rituais')"><strong>Meu ritual</strong><span>${count} cuidados marcados hoje</span></div><div class="tile" onclick="nav('tecnicas')"><strong>Praticar uma técnica</strong><span>Toques e escolhas, sem precisar escrever</span></div><div class="tile" onclick="nav('diario')"><strong>Meu calendário</strong><span>${S.journal.length} registros na jornada</span></div><div class="tile" onclick="nav('sonhos')"><strong>Quadro dos sonhos</strong><span>${S.board.length} imagens salvas</span></div></div><section class="card"><h3>Como estou hoje?</h3><p class="muted small">Selecione o humor e a energia; eles ficam salvos neste aparelho.</p><div class="flex">${['😢','😟','😐','🙂','😄'].map((e,i)=>`<button class="chip ${S.mood===i+1?'active':''}" onclick="S.mood=${i+1};save();render()">${e}</button>`).join('')}</div><p>Energia: <b class="gold">${S.energy}/5</b></p><input aria-label="Nível de energia" type="range" min="1" max="5" value="${S.energy}" oninput="S.energy=+this.value;save();render()"><p>Minha percepção de possibilidade hoje: <b class="gold">${S.confidence}%</b></p><input aria-label="Percepção subjetiva de possibilidade" type="range" min="0" max="100" value="${S.confidence}" oninput="S.confidence=+this.value;save();render()"><div class="notice">Esse percentual expressa como você se sente hoje, não é uma previsão das chances reais de um acontecimento.</div>${b('Registrar meu estado','saveMood()','')}</section><section class="card"><h3>Mapa de conquistas</h3>${S.goals.map((g,i)=>`<div class="step"><div class="flex between"><strong>${esc(g.name)}</strong><span class="tag">${(g.steps||[]).filter(x=>x.done).length}/${(g.steps||[]).length} passos</span></div>${pct((g.steps||[]).length?100*g.steps.filter(x=>x.done).length/g.steps.length:0)}<div class="flex" style="margin-top:9px">${b('Ver etapas',`openGoal(${i})`)}${b('Remover',`removeGoal(${i})`)}</div></div>`).join('')}<label>Adicionar novo objetivo<input id="goalName" placeholder="Ex.: conquistar minha casa"></label>${b('Adicionar objetivo','addGoal()','')}</section><section class="card"><h3>Mensagem de hoje</h3><p class="quote">${affirmations[S.affirm%affirmations.length]}</p>${b('Outra mensagem','S.affirm++;save();render()')}</section>`}
function saveMood(){record('Humor','Meu estado do dia',`Humor ${S.mood}/5 · Energia ${S.energy}/5 · Possibilidade percebida ${S.confidence}%`);alert('Estado registrado no diário!')}
function addGoal(){let n=$('goalName').value.trim();if(!n)return;S.goals.push({name:n,steps:[]});save();render()}function removeGoal(i){if(!confirm('Remover este objetivo?'))return;S.goals.splice(i,1);save();render()}function openGoal(i){let g=S.goals[i];$('app').innerHTML=`${b('← Voltar','render()')}<section class="card"><h2>${esc(g.name)}</h2><p>Marque as etapas já realizadas.</p>${(g.steps||[]).map((s,j)=>`<label class="step"><input type="checkbox" ${s.done?'checked':''} onchange="S.goals[${i}].steps[${j}].done=this.checked;save();openGoal(${i})">${esc(s.name)}</label>`).join('')}<label>Adicionar etapa<input id="stepName" placeholder="Ex.: preparar currículo"></label>${b('Adicionar etapa',`addStep(${i})`,'')}</section>`}function addStep(i){let v=$('stepName').value.trim();if(!v)return;S.goals[i].steps.push({name:v,done:false});save();openGoal(i)}
function techPage(){if(selectedTechnique)return techDetail();return `<h2>Ateliê de técnicas</h2><p class="muted">Abra uma prática, escolha respostas e toque em concluir. Não precisa digitar.</p><div class="grid">${techniques.map(t=>`<div class="tile" onclick="selectedTechnique='${t.id}';render();window.scrollTo(0,0)"><span>${esc(t.category)}</span><strong>${esc(t.name)}</strong><span>${esc(t.source)}</span></div>`).join('')}</div>`}
function techDetail(){let t=techniques.find(x=>x.id===selectedTechnique);let d=S.draft[t.id]||{};let completed=t.steps.filter((s,i)=>d[i]!==undefined).length;return `${b('← Voltar às técnicas',"selectedTechnique=null;render()") }<section class="card"><span class="tag">${esc(t.category)}</span><h2 style="margin-top:10px">${esc(t.name)}</h2><p class="muted small">${esc(t.source)}</p><p>${esc(t.intro)}</p>${pct(100*completed/t.steps.length)}<p class="small gold">${completed} de ${t.steps.length} etapas escolhidas</p>${t.steps.map((s,i)=>`<div class="step"><strong>${i+1}. ${esc(s)}</strong><div class="flex" style="margin-top:10px">${t.opts[i].map((o,j)=>`<button class="chip ${d[i]===j?'active':''}" onclick="choose('${t.id}',${i},${j})">${esc(o)}</button>`).join('')}</div></div>`).join('')}${t.id==='scripting'?`<div class="card soft"><h3>Minha frase do futuro</h3><p class="quote">${esc(scriptSentence(t,d))}</p></div>`:''}<div class="flex" style="margin-top:15px">${b('Concluir e salvar no diário',`finish('${t.id}')`,'')}${b('Limpar escolhas',`clearTech('${t.id}')`)}</div></section>`}
function scriptSentence(t,d){return `Eu me imagino em ${String((t.opts[0][d[0]]||'uma nova fase')).toLowerCase()}, sentindo ${String((t.opts[1][d[1]]||'esperança')).toLowerCase()}, construindo ${String((t.opts[2][d[2]]||'minhas conquistas')).toLowerCase()}. Meu próximo passo é ${String((t.opts[3][d[3]]||'começar')).toLowerCase()}.`}
function choose(id,i,j){S.draft[id]??={};S.draft[id][i]=j;save();render()}function clearTech(id){delete S.draft[id];save();render()}function finish(id){let t=techniques.find(x=>x.id===id),d=S.draft[id]||{};if(Object.keys(d).length===0){alert('Selecione pelo menos uma opção.');return}let answers=t.steps.map((s,i)=>d[i]===undefined?null:`${s}: ${t.opts[i][d[i]]}`).filter(Boolean);record('Técnica',t.name,answers.join(' | '));S.practice[id]=(S.practice[id]||0)+1;delete S.draft[id];save();selectedTechnique=null;page='diario';render();window.scrollTo(0,0)}
function diary(){let selected=S.selectedDate||today(),entries=S.journal.filter(x=>x.date===selected);let first=new Date(year,month,1),start=first.getDay(),total=new Date(year,month+1,0).getDate();return `<h2>Diário & calendário</h2><p class="muted">Seu histórico de práticas e conquistas.</p><section class="card"><div class="flex between">${b('‹', 'shiftMonth(-1)')}<h3>${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3>${b('›','shiftMonth(1)')}</div><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${Array.from({length:start},()=>'<div></div>').join('')}${Array.from({length:total},(_,i)=>{let date=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="day ${S.journal.some(x=>x.date===date)?'has':''} ${date===today()?'today':''} ${selected===date?'selected':''}" onclick="S.selectedDate='${date}';save();render()">${i+1}</button>`}).join('')}</div></section><section class="card"><h3>${new Date(selected+'T12:00:00').toLocaleDateString('pt-BR',{dateStyle:'long'})}</h3>${entries.length?entries.map(x=>`<div class="step"><span class="tag">${esc(x.kind)}</span> <strong>${esc(x.label)}</strong><p class="small muted">${esc(x.details)}</p></div>`).join(''):'<p class="muted">Nenhum registro nesta data.</p>'}<label>Como foi seu dia? (opcional)<textarea id="journalNote" placeholder="Uma frase já é suficiente..."></textarea></label>${b('Salvar nota','saveNote()','')}</section><section class="card"><h3>Meu histórico</h3><p>${S.journal.length} registros feitos</p>${b('Exportar meus dados','exportData()')}${b('Importar backup','document.getElementById("importData").click()')}<input class="hidden" type="file" id="importData" accept="application/json" onchange="importData(this)"></section>`}
function shiftMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}function saveNote(){let v=$('journalNote').value.trim();if(!v)return;record('Diário','Minha reflexão',v);S.selectedDate=today();save();render()}function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alem-meus-dados.json';a.click();URL.revokeObjectURL(a.href)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.journal)||!Array.isArray(v.goals))throw Error();if(confirm('Substituir seus registros atuais pelo backup?')){S={...defaults,...v};save();render()}}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function dreams(){return `<h2>Quadro dos sonhos</h2><p class="muted">Escolha imagens do seu aparelho. Elas ficam armazenadas somente neste navegador.</p><section class="card"><h3>Meu painel de visualização</h3><input type="file" id="dreamFile" accept="image/*"><label>Categoria<select id="dreamCategory"><option>Casa e independência</option><option>Carreira e dinheiro</option><option>Amor e família</option><option>Autocuidado</option><option>Viagens e experiências</option></select></label>${b('Adicionar ao painel','addDream()','')}<div class="board" style="margin-top:14px">${S.board.map((x,i)=>`<div><img src="${x.data}" alt="Imagem do sonho"><div class="small muted">${esc(x.category)}</div>${b('Remover',`removeDream(${i})`)}</div>`).join('')}</div>${!S.board.length?'<p class="muted">Seu painel está esperando a primeira imagem.</p>':''}</section><section class="card"><h3>Mapa de conquistas</h3><p class="muted">Volte à tela inicial para criar objetivos e marcar etapas.</p>${b('Abrir meus objetivos',"nav('inicio')",'')}</section>`}
function addDream(){let f=$('dreamFile').files[0];if(!f){alert('Escolha uma imagem.');return}let category=$('dreamCategory').value,reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),max=700,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.board.push({data:c.toDataURL('image/jpeg',.72),category});save();render()};img.src=reader.result};reader.readAsDataURL(f)}function removeDream(i){S.board.splice(i,1);save();render()}
function books(){const groups=[{title:'Coletânea de Prosperidade — Hélio Couto',sub:'Capítulos IV (Autossabotagem), V (Sistema de Crenças), VIII (Alegria) e IX (O Soltar).',ids:['autosabotagem','crencas','gratidao','desapego','financas']},{title:'Como Criar um Novo Eu — Joe Dispenza',sub:'Mudança de identidade, padrões de pensamento e prática de meditação.',ids:['novo-eu','crencas','visual']},{title:'Como Aumentar a Capacidade do Seu Cérebro — Joe Dispenza',sub:'Capítulos 6–7 (neuroplasticidade e repetição) e 11 (ensaio mental).',ids:['habito','visual','novo-eu']}];return `<h2>Biblioteca prática</h2><p class="muted">Cada botão abre um exercício interativo relacionado a um tema dos livros enviados. Os exercícios são adaptações originais, não transcrições nem métodos oficiais dos autores.</p>${groups.map(g=>`<section class="card"><h3>${esc(g.title)}</h3><p class="muted small">${esc(g.sub)}</p><div class="flex">${g.ids.map(id=>{let t=techniques.find(x=>x.id===id);return b(esc(t.name),`selectedTechnique='${id}';page='tecnicas';render();window.scrollTo(0,0)`)}).join('')}</div></section>`).join('')}<p class="notice">Os conceitos de manifestação e prosperidade são apresentados como práticas de reflexão e organização pessoal; os exercícios não garantem resultados financeiros, afetivos ou de saúde.</p>`}
const tasks=['Beber água e comer algo','Escovar os dentes','Cuidar do cabelo','Tomar banho ou trocar de roupa','Movimentar o corpo suavemente','Fazer uma ação por independência','Praticar uma técnica','Reconhecer um progresso'];function ritual(){let d=S.day[today()]||{},count=tasks.filter((x,i)=>d[i]).length;return `<h2>Ritual do dia</h2><p class="muted">Escolha o que cabe na sua energia. Não precisa fazer tudo.</p><section class="card"><h3>Meu checklist</h3>${pct(100*count/tasks.length)}<p class="gold">${count}/${tasks.length} cuidados</p>${tasks.map((x,i)=>`<label class="step"><input type="checkbox" ${d[i]?'checked':''} onchange="checkDay(${i},this.checked)">${esc(x)}</label>`).join('')}</section><section class="card"><h3>Afirmação para hoje</h3><p class="quote">${affirmations[S.affirm%affirmations.length]}</p>${b('Trocar afirmação','S.affirm++;save();render()')}</section><section class="card"><h3>Escolha sua prática rápida</h3><div class="flex">${['369','visual','autocuidado','gratidao','amor'].map(id=>{let t=techniques.find(x=>x.id===id);return b(esc(t.name),`selectedTechnique='${id}';page='tecnicas';render()`)}).join('')}</div></section>`}function checkDay(i,v){S.day[today()]??={};S.day[today()][i]=v;if(v)record('Ritual',tasks[i],'Cuidado marcado');save();render()}
render();
</script></body></html>
